name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.0

      - name: Install dependencies
        run: go mod tidy

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check agent boundary
        run: |
          if go list -deps ./agent | grep -E '^(github.com/metruzanca/caffeinator/internal|github.com/bwmarrin/discordgo|github.com/charmbracelet/log|github.com/spf13/viper)'; then
            echo "agent must not depend on Discord, internal packages, charmbracelet/log, or Viper"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
